name: Diagnose Sources

# 手动触发的连通性诊断：在 Runner 的真实出口 IP 上逐个探测数据源。
# 存在的理由是豆瓣对不同 IP 段策略不同 —— 本地（住宅 IP）能通的接口，
# 在 GitHub Actions（数据中心 IP）上可能返回 200 但内容为空壳。
# 改抓取逻辑前先跑一次，用 Runner 的结论而不是本地的结论做决定。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rottendouban-diagnose
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe data sources
        env:
          # TMDB 中文片名反查探针需要真密钥，否则那一项只会报"未配置"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: python scripts/diagnose_sources.py

  # Rexxar 的 HTTP 400 响应体是 {"msg":"subject_ip_rate_limit"}，即按 IP 配额。
  # 用 matrix 让每个节流档位跑在独立 Runner（独立 IP）上：否则先跑的档位会把配额
  # 吃光、后面的档位一律 0 成功，结论毫无意义（上一轮的请求头对照就踩了这个坑，
  # C/D 两个变体得 0 并不是因为它们差，而是因为 A/B 已经把配额用完了）。
  #
  # 这个 job 已经回答过它要问的问题：四档各 20 次连发得 10/14/19/17 成功，
  # 且首次失败都落在第 10-11 次 —— 配额是按时间窗滚动的固定额度，放慢只能摊平、
  # 不能提高总额，所以"按 IP 分片并行"与"把节流调到 8s 就稳了"都被否掉，
  # 最终方案是时间预算 + 跨轮续抓。保留本 job 作为回归探针：若哪一档的成功数
  # 明显变化，说明豆瓣改了配额策略，抓取参数需要重新标定。
  rexxar-throttle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        delay: ['0.5', '2', '4', '8']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe Rexxar at ${{ matrix.delay }}s intervals
        env:
          REXXAR_DELAY: ${{ matrix.delay }}
          REXXAR_SAMPLES: '20'
        run: python scripts/diagnose_rexxar.py
