name: Fetch Data and Deploy

# 拆成 fetch / deploy 两个 job 是修 bug，不是排版偏好：
# environment: github-pages 会让 job 一启动就登记一个 Pages deployment，
# 爬虫 job 中途失败会把这个 deployment 永久留在 queued，后续所有 run 排在它后面
# 直到被 GitHub 取消（历史上 4 个 deployment 各占位约 30 天，数据因此停更）。
on:
  schedule:
    # 每月 1 号、16 号 04:17 UTC（每半月一次）。
    # 刻意不用整点：官方文档指出 "High load times include the start of every hour"，
    # 整点触发的定时任务更容易被延迟调度。
    - cron: '17 4 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write   # 回传 douban_cache.json 与 movies.json
  pages: write
  id-token: write   # actions/deploy-pages 需要

concurrency:
  # 与 deploy-site.yml 共用一个组：两条流水线都会部署 Pages。分组若各自独立，
  # 抓取途中的一次前端提交会让 deploy-site 把上一轮的 movies.json 重新部署上去，
  # 线上数据静默回退，直到半个月后的下一次定时抓取才被纠正。
  group: rottendouban-${{ github.ref }}
  cancel-in-progress: false

env:
  # 豆瓣阶段（榜单 + 详情 + 短评共用一份）的墙钟上限，秒。用尽即停止发请求，
  # 未完成的条目下一轮从 douban_cache.json 续抓。这是"整轮必定能在
  # timeout-minutes 内跑完并提交缓存"的唯一保证 —— 之前没有它，固定节流下
  # 250×2 次请求叠加配额退避实测烧到 75 分钟被强杀，缓存颗粒无收。
  DOUBAN_TIME_BUDGET: '1200'

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 豆瓣阶段有 DOUBAN_TIME_BUDGET（默认 1200s）硬上限，两轮（详情 + 短评）
    # 共用同一份预算，故豆瓣侧墙钟 ≤ 20 分钟；加上榜单、RT/TMDB 与入库约 25 分钟。
    # 40 分钟留足余量 —— 之前设 75 分钟反而有害：跑不完就被强杀，缓存颗粒无收。
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 爬虫只用标准库（urllib + sqlite3），无需 pip install

      - name: Record previous movie count
        id: before
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('site/data/movies.json'))))" 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "仓库中现有 $COUNT 部电影"

      - name: Fetch movie data
        env:
          CRAWLER_MODE: full
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m crawler.main
        # 不再用 `|| true` / continue-on-error：上游抖动时 crawler 会因低于
        # MIN_MOVIES_TO_PUBLISH 而非零退出，此处让它如实失败并保留线上旧数据

      - name: Verify site data
        id: after
        env:
          # 经 env 传入而非 ${{ }} 直插 shell：值虽是自己算出的整数，
          # 但表达式直接拼进脚本是 Actions 的注入面，不给它留口子
          PREV_COUNT: ${{ steps.before.outputs.count }}
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('site/data/movies.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "本次生成 $COUNT 部电影"
          python scripts/verify_site.py
          if [ "$COUNT" -lt "$PREV_COUNT" ]; then
            echo "新数据比仓库中的少（$COUNT < $PREV_COUNT），不覆盖线上" >&2
            exit 1
          fi

      # 一个步骤提交全部改动，不是图省事 —— 分开提交会让工作树里留着
      # 未提交的 movies.json（爬虫每轮都会重写它，而它是被跟踪的文件），
      # 后面的 git rebase 会直接以 "You have unstaged changes" 失败。
      # 上一个 run 36267829360 正是死在这里：78 条详情抓完，缓存一条没推上去。
      # 另：movies.csv / stats.json 在 .gitignore 里，Pages 直接上传 ./site 目录，
      # 不需要入库，所以这里只提交 douban_cache.json 与 movies.json。
      - name: Commit data
        if: always()
        env:
          # 校验没过就不发布 movies.json，只回传缓存 —— 缓存是跨轮续抓的本钱，
          # 丢了就得从零重抓；movies.json 丢了下一轮会重新生成。
          VERIFIED: ${{ steps.after.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$VERIFIED" != "success" ]; then
            echo "站点校验未通过，丢弃这份 movies.json（旧版本仍在仓库里），只回传缓存"
            git checkout -- site/data/movies.json 2>/dev/null || true
          else
            git add -f site/data/movies.json
          fi

          if [ -f crawler/data/douban_cache.json ]; then
            git add -f crawler/data/douban_cache.json
          else
            echo "缓存文件不存在，跳过"
          fi

          if git diff --cached --quiet; then
            echo "无数据变化"
            exit 0
          fi

          SIZE=0
          if [ -f crawler/data/douban_cache.json ]; then
            SIZE=$(python -c "import json;print(len(json.load(open('crawler/data/douban_cache.json'))))")
          fi
          git commit -m "chore(data): cache $SIZE subjects [skip ci]"

          # checkout@v4 处于 detached HEAD，git pull --rebase 用不了，只能 fetch + rebase。
          # 重试 3 次：网络抖动或恰好撞上并发推送时，一次失败就会让整轮白跑，
          # 而这些恰恰都是重试一下就能过的瞬时故障。
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort 2>/dev/null || true
              echo "第 $attempt 次 rebase 失败（远端改动与本次提交冲突）" >&2
              sleep 5
              continue
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已回传：缓存 $SIZE 条"
              exit 0
            fi
            echo "第 $attempt 次 push 失败，重试" >&2
            sleep 5
          done
          # 推不上去就如实失败：deploy 是独立 job、按分支重新检出，
          # 数据没落到 main 的话它部署的仍是上一轮的 movies.json，
          # 绿灯会让人误以为这轮成功了。
          echo "三次推送均失败，本轮数据未能回传" >&2
          exit 1

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          movies = json.load(open('site/data/movies.json', encoding='utf-8'))
          total = len(movies)
          rt = sum(1 for m in movies if (m.get('tomatometer') or -1) >= 0)
          db = sum(1 for m in movies if (m.get('douban_score') or 0) > 0)
          both = sum(1 for m in movies if (m.get('tomatometer') or -1) >= 0
                     and (m.get('douban_score') or 0) > 0)
          intro = sum(1 for m in movies if m.get('douban_synopsis'))
          cast = sum(1 for m in movies if m.get('douban_cast'))
          comments = sum(1 for m in movies if m.get('douban_comments'))
          poster = sum(1 for m in movies if m.get('poster_url'))
          cache = json.load(open('crawler/data/douban_cache.json', encoding='utf-8'))
          print('## 数据抓取结果\n')
          print('| 指标 | 数量 |')
          print('|---|---|')
          print(f'| 电影总数 | {total} |')
          print(f'| 有烂番茄评分 | {rt} |')
          print(f'| 有豆瓣评分 | {db} |')
          print(f'| 双源齐全 | {both} |')
          print(f'| 有豆瓣简介 | {intro} |')
          print(f'| 有导演/演员 | {cast} |')
          print(f'| 有豆瓣短评 | {comments} |')
          print(f'| 有海报 | {poster} |')
          print(f'| 豆瓣缓存条目 | {len(cache)} |')
          if len(cache) < total:
              print(f'\n> ℹ️ 豆瓣详情缓存 {len(cache)}/{total}。Rexxar 按 IP 的时间窗配额'
                    f'（HTTP 400 + `subject_ip_rate_limit`）撑不住一轮抓满 250×2 次请求，'
                    f'故设 {os.environ.get("DOUBAN_TIME_BUDGET", "1200")}s 时间预算，'
                    f'超出的条目下一轮从缓存续抓，**覆盖率逐轮递增**。')
              print(f'>\n> 对照：第一轮 78/250、第二轮 101/250（实测）。'
                    f'若本行数字不升，说明配额策略变了，需重跑 diagnose-sources.yml 标定。')
          PY

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 显式按分支名检出：fetch job 刚推了新提交，而 github.sha 仍是触发时的旧 SHA，
      # 用默认值会把上一次的 movies.json 部署上去。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
