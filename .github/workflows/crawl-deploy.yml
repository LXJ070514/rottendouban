name: Fetch Data and Deploy

# 拆成 fetch / deploy 两个 job 是修 bug，不是排版偏好：
# environment: github-pages 会让 job 一启动就登记一个 Pages deployment，
# 爬虫 job 中途失败会把这个 deployment 永久留在 queued，后续所有 run 排在它后面
# 直到被 GitHub 取消（历史上 4 个 deployment 各占位约 30 天，数据因此停更）。
on:
  schedule:
    # 每月 1 号、16 号 04:17 UTC（每半月一次）。
    # 刻意不用整点：官方文档指出 "High load times include the start of every hour"，
    # 整点触发的定时任务更容易被延迟调度。
    - cron: '17 4 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write   # 回传 douban_cache.json 与 movies.json
  pages: write
  id-token: write   # actions/deploy-pages 需要

concurrency:
  group: rottendouban-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # 豆瓣阶段（榜单 + 详情 + 短评共用一份）的墙钟上限，秒。用尽即停止发请求，
  # 未完成的条目下一轮从 douban_cache.json 续抓。这是"整轮必定能在
  # timeout-minutes 内跑完并提交缓存"的唯一保证 —— 之前没有它，固定节流下
  # 250×2 次请求叠加配额退避实测烧到 75 分钟被强杀，缓存颗粒无收。
  DOUBAN_TIME_BUDGET: '1200'

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 豆瓣阶段有 DOUBAN_TIME_BUDGET（默认 1200s）硬上限，两轮（详情 + 短评）
    # 共用同一份预算，故豆瓣侧墙钟 ≤ 20 分钟；加上榜单、RT/TMDB 与入库约 25 分钟。
    # 40 分钟留足余量 —— 之前设 75 分钟反而有害：跑不完就被强杀，缓存颗粒无收。
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 爬虫只用标准库（urllib + sqlite3），无需 pip install

      - name: Record previous movie count
        id: before
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('site/data/movies.json'))))" 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "仓库中现有 $COUNT 部电影"

      - name: Fetch movie data
        env:
          CRAWLER_MODE: full
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m crawler.main
        # 不再用 `|| true` / continue-on-error：上游抖动时 crawler 会因低于
        # MIN_MOVIES_TO_PUBLISH 而非零退出，此处让它如实失败并保留线上旧数据

      # 缓存必须独立于抓取成败回传：豆瓣按 IP 的时间窗配额撑不住一轮抓满
      # 250×2 次请求，靠"每轮补一点、下轮从缓存接着补"才能让覆盖率单调递增。
      # 放在 Verify 之前 + if: always()，抓取失败时缓存照样落地。
      - name: Commit douban cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f crawler/data/douban_cache.json
          if git diff --cached --quiet; then
            echo "豆瓣缓存无变化"
            exit 0
          fi
          SIZE=$(python -c "import json;print(len(json.load(open('crawler/data/douban_cache.json'))))")
          git commit -m "chore(douban): cache $SIZE subjects [skip ci]"
          # checkout@v4 处于 detached HEAD，git pull --rebase 不可用；
          # 且并发推送（另一次 run 或人工提交）会让裸 push 非快进失败、整轮成果丢失
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Verify site data
        id: after
        env:
          # 经 env 传入而非 ${{ }} 直插 shell：值虽是自己算出的整数，
          # 但表达式直接拼进脚本是 Actions 的注入面，不给它留口子
          PREV_COUNT: ${{ steps.before.outputs.count }}
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('site/data/movies.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "本次生成 $COUNT 部电影"
          python scripts/verify_site.py
          if [ "$COUNT" -lt "$PREV_COUNT" ]; then
            echo "新数据比仓库中的少（$COUNT < $PREV_COUNT），不覆盖线上" >&2
            exit 1
          fi

      - name: Commit refreshed data
        env:
          NEW_COUNT: ${{ steps.after.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f site/data/movies.json site/data/movies.csv site/data/stats.json
          if git diff --cached --quiet; then
            echo "站点数据无变化"
            exit 0
          fi
          git commit -m "Refresh data: $NEW_COUNT movies [skip ci]"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          movies = json.load(open('site/data/movies.json', encoding='utf-8'))
          total = len(movies)
          rt = sum(1 for m in movies if (m.get('tomatometer') or -1) >= 0)
          db = sum(1 for m in movies if (m.get('douban_score') or 0) > 0)
          both = sum(1 for m in movies if (m.get('tomatometer') or -1) >= 0
                     and (m.get('douban_score') or 0) > 0)
          intro = sum(1 for m in movies if m.get('douban_synopsis'))
          cast = sum(1 for m in movies if m.get('douban_cast'))
          comments = sum(1 for m in movies if m.get('douban_comments'))
          poster = sum(1 for m in movies if m.get('poster_url'))
          cache = json.load(open('crawler/data/douban_cache.json', encoding='utf-8'))
          print('## 数据抓取结果\n')
          print('| 指标 | 数量 |')
          print('|---|---|')
          print(f'| 电影总数 | {total} |')
          print(f'| 有烂番茄评分 | {rt} |')
          print(f'| 有豆瓣评分 | {db} |')
          print(f'| 双源齐全 | {both} |')
          print(f'| 有豆瓣简介 | {intro} |')
          print(f'| 有导演/演员 | {cast} |')
          print(f'| 有豆瓣短评 | {comments} |')
          print(f'| 有海报 | {poster} |')
          print(f'| 豆瓣缓存条目 | {len(cache)} |')
          if len(cache) < total:
              print(f'\n> ℹ️ 豆瓣详情缓存 {len(cache)}/{total}。Rexxar 按 IP 的时间窗配额'
                    f'（HTTP 400 + `subject_ip_rate_limit`）撑不住一轮抓满 250×2 次请求，'
                    f'故设 {os.environ.get("DOUBAN_TIME_BUDGET", "1200")}s 时间预算，'
                    f'超出的条目下一轮从缓存续抓，覆盖率单调递增。')
          PY

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 显式按分支名检出：fetch job 刚推了新提交，而 github.sha 仍是触发时的旧 SHA，
      # 用默认值会把上一次的 movies.json 部署上去。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
