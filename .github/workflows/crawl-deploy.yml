name: Fetch Data and Deploy

# 拆成 fetch / deploy 两个 job 是修 bug，不是排版偏好：
# environment: github-pages 会让 job 一启动就登记一个 Pages deployment，
# 爬虫 job 中途失败会把这个 deployment 永久留在 queued，后续所有 run 排在它后面
# 直到被 GitHub 取消（历史上 4 个 deployment 各占位约 30 天，数据因此停更）。
on:
  schedule:
    # 每月 1 号、16 号 04:17 UTC（每半月一次）。
    # 刻意不用整点：官方文档指出 "High load times include the start of every hour"，
    # 整点触发的定时任务更容易被延迟调度。
    - cron: '17 4 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write   # 回传 douban_cache.json 与 movies.json
  pages: write
  id-token: write   # actions/deploy-pages 需要

concurrency:
  group: rottendouban-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 爬虫只用标准库（urllib + sqlite3），无需 pip install

      - name: Record previous movie count
        id: before
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('site/data/movies.json'))))" 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "仓库中现有 $COUNT 部电影"

      - name: Fetch movie data
        env:
          CRAWLER_MODE: full
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m crawler.main
        # 不再用 `|| true` / continue-on-error：上游抖动时 crawler 会因低于
        # MIN_MOVIES_TO_PUBLISH 而非零退出，此处让它如实失败并保留线上旧数据

      - name: Verify site data
        id: after
        env:
          # 经 env 传入而非 ${{ }} 直插 shell：值虽是自己算出的整数，
          # 但表达式直接拼进脚本是 Actions 的注入面，不给它留口子
          PREV_COUNT: ${{ steps.before.outputs.count }}
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('site/data/movies.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "本次生成 $COUNT 部电影"
          python scripts/verify_site.py
          if [ "$COUNT" -lt "$PREV_COUNT" ]; then
            echo "新数据比仓库中的少（$COUNT < $PREV_COUNT），不覆盖线上" >&2
            exit 1
          fi

      - name: Commit refreshed data
        env:
          NEW_COUNT: ${{ steps.after.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f crawler/data/douban_cache.json site/data/movies.json
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "Refresh data: $NEW_COUNT movies [skip ci]"
            git push
          fi

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          movies = json.load(open('site/data/movies.json', encoding='utf-8'))
          total = len(movies)
          rt = sum(1 for m in movies if (m.get('tomatometer') or -1) >= 0)
          db = sum(1 for m in movies if (m.get('douban_score') or 0) > 0)
          both = sum(1 for m in movies if (m.get('tomatometer') or -1) >= 0
                     and (m.get('douban_score') or 0) > 0)
          poster = sum(1 for m in movies if m.get('poster_url'))
          cache = json.load(open('crawler/data/douban_cache.json', encoding='utf-8'))
          floor = os.environ.get('MIN_MOVIES_TO_PUBLISH') or 50
          print('## 数据抓取结果\n')
          print('| 指标 | 数量 |')
          print('|---|---|')
          print(f'| 电影总数 | {total} |')
          print(f'| 有烂番茄评分 | {rt} |')
          print(f'| 有豆瓣评分 | {db} |')
          print(f'| 双源齐全 | {both} |')
          print(f'| 有海报 | {poster} |')
          print(f'| 豆瓣缓存条目 | {len(cache)} |')
          print(f'\n发布下限 {floor} 已通过；抓取失败时不会覆盖线上数据。')
          if db < total * 0.5:
              print('\n> ⚠️ 豆瓣覆盖率偏低，通常是其反爬限流所致：返回 HTTP 200，'
                    '但页面里没有 `window.__DATA__`、或有 `__DATA__` 而 `items` 为空'
                    '（CI 实测后者是主流形态）。爬虫按空结果比例熔断后回落到缓存，'
                    '缓存会随每轮运行逐步补齐，烂番茄侧不受影响。')
          PY

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
